<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PBI lineage · Pixi</title>
  <script type="module" crossorigin src="/DMTECH_BW_graph/pixi/assets/index-Be_LLDYY.js"></script>
  <link rel="stylesheet" crossorigin href="/DMTECH_BW_graph/pixi/assets/index-BjMkkplH.css">
</head>
<body>
  <div class="layout">
    <aside>
      <h2>Поиск · пучок</h2>
      <div class="search-wrap">
        <input type="text" id="q" placeholder="например ZBE_02" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="qSuggest" aria-expanded="false" />
        <ul id="qSuggest" class="search-suggest" role="listbox" hidden></ul>
      </div>
      <label class="chk" style="margin:0 0 4px">глубина
        <select id="egoDepth" style="width:auto;margin:0 0 0 8px;padding:4px 6px">
          <option value="1">1 — только прямые</option>
          <option value="2" selected>2 — пучок</option>
          <option value="3">3 — шире</option>
        </select>
      </label>
      <label class="chk">
        <input type="checkbox" id="egoParents" checked />
        родители — кто грузит в него
      </label>
      <label class="chk">
        <input type="checkbox" id="egoChildren" checked />
        потомки — куда он грузится
      </label>
      <h2>Тип узла</h2>
      <div id="types"></div>
      <label class="chk" style="margin-top:10px">
        <input type="checkbox" id="showFrozenLoads" checked />
        показывать загрузки в FROZEN
      </label>
      <label class="chk">
        <input type="checkbox" id="showAllCv" />
        все CalcView (включая висящие)
      </label>
      <label class="chk">
        <input type="checkbox" id="hideLiveDtp" />
        только stale DTP — скрыть живые загрузки
      </label>
      <label class="chk">
        <input type="checkbox" id="hideNeverDtp" />
        скрыть DTP без загрузок (никогда)
      </label>
      <details class="fold">
        <summary>Легенда · префикс</summary>
        <div id="legend"></div>
      </details>
      <details class="fold">
        <summary>Форма</summary>
        <div id="legendShape"></div>
      </details>
    </aside>
    <div id="graphWrap">
      <div class="graph-chrome">
        <header class="graph-header">
          <h1>Lineage PBI · Pixi</h1>
          <span class="badge">снимок</span>
          <span class="badge" id="glBadge">GL…</span>
          <span class="badge" id="fpsBadge">— fps</span>
          <div class="meta" id="hdrMeta">загрузка…</div>
          <button type="button" class="ghost" id="fitBtn">Вписать</button>
          <button type="button" class="ghost" id="relayout">Layout</button>
        </header>
        <nav class="graph-crumbs" id="graphCrumbs" aria-label="Навигация по графу" hidden></nav>
      </div>
      <div id="graph"></div>
      <div id="boot">загрузка…</div>
      <div class="float-panel" id="panelObject">
        <div class="float-head">Объект</div>
        <div class="float-body" id="detailBody"><p class="meta">клик по узлу или ребру</p></div>
      </div>
      <div class="float-panel" id="panelLists">
        <div class="float-head">Узлы · Рёбра</div>
        <div class="float-body">
          <details class="fold float-fold">
            <summary>Узлы</summary>
            <ul class="objlist" id="visibleList"></ul>
          </details>
          <details class="fold float-fold">
            <summary>Рёбра</summary>
            <div id="edgesBody"><p class="meta">выберите узел</p></div>
          </details>
        </div>
      </div>
    </div>
  </div>
  <div id="nodeTip" role="tooltip"></div>
</body>
</html>
